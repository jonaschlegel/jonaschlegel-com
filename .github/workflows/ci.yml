name: CI
on: push

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
      - run: pnpm install
      # Type-aware lint rules need the generated Next.js route types.
      - run: pnpm exec next typegen
      - run: pnpm eslint . --max-warnings 0
      - run: pnpm build
      - run: pnpm tsc
